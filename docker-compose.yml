services:
  vidgrab:
    build:
      context: .
      args:
        VIDGRAB_BUILD: ${VIDGRAB_BUILD:-dev}
    image: vidgrab:latest
    container_name: vidgrab
    ports:
      # 只對本機發佈。要讓別台機器的 agent 連，改成 "8310:8310" 並務必設 VIDGRAB_API_TOKEN
      - "127.0.0.1:8310:8310"
    volumes:
      # 專案、下載的素材、B 站 cookie 都在這裡
      - vidgrab-data:/data
    environment:
      VIDGRAB_HOST: 0.0.0.0
      VIDGRAB_PORT: "8310"
      # 設了就啟用 Bearer 認證（建議：export VIDGRAB_API_TOKEN=$(openssl rand -hex 24)）
      VIDGRAB_API_TOKEN: ${VIDGRAB_API_TOKEN:-}
      # 沒設 token 時容器內綁 0.0.0.0 需要這個；port 只對 127.0.0.1 發佈所以安全
      VIDGRAB_NO_AUTH: ${VIDGRAB_NO_AUTH:-1}
    restart: unless-stopped
    # 下載大檔需要時間，健康檢查放寬一點
    stop_grace_period: 30s

volumes:
  vidgrab-data:
